name: Build Android app

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'android-signing/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build.mjs'
      - 'scripts/android-signing.mjs'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'assets/**'
      - 'android-signing/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/build.mjs'
      - 'scripts/android-signing.mjs'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        # sharp скачивает libvips с GitHub: изредка таймаут — повторяем
        run: |
          for attempt in 1 2 3; do npm ci && break; echo "npm ci failed (attempt $attempt)"; [ $attempt = 3 ] && exit 1; sleep 20; done

      - name: Build web app
        run: npm run build:app

      - name: Create Android project
        run: |
          npx cap add android
          npm run android:assets
          node scripts/android-signing.mjs
          node scripts/android-manifest.mjs
          npx cap sync android

      - name: Set version
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"1.0\"/versionName \"2.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Build APK
        working-directory: android
        # дистрибутив Gradle иногда не успевает скачаться — повторяем
        run: |
          for attempt in 1 2 3; do ./gradlew assembleDebug --no-daemon && break; echo "gradle failed (attempt $attempt)"; [ $attempt = 3 ] && exit 1; sleep 20; done

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk qol-ai.apk
          # проверка: APK подписан ключом из android-signing/
          expected=$(keytool -list -v -keystore android-signing/debug.keystore -storepass android | grep -m1 'SHA256:' | awk '{print $2}')
          actual=$(keytool -printcert -jarfile qol-ai.apk | grep -m1 'SHA256:' | awk '{print $2}')
          echo "expected $expected"; echo "actual   $actual"
          test "$expected" = "$actual"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qol-ai-apk
          path: qol-ai.apk

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest qol-ai.apk \
            --title "Qol AI для Android (2.0.${{ github.run_number }})" \
            --notes "Сборка из коммита ${GITHUB_SHA::8}. Скачайте qol-ai.apk и установите на телефон (нужно разрешить установку из неизвестных источников). Если стоит старая версия Qol AI, сначала удалите её." \
            --target "$GITHUB_SHA"
