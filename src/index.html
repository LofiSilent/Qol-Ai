<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Qol AI — текст в жесты на 3D-модели." />
  <title>Qol AI — 3D жесты</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="top">
    <strong class="logo">Qol <span>AI</span></strong>
    <span class="tag">прототип</span>
  </header>

  <main>
    <section class="intro">
      <h1>Текст в жесты на 3D-модели</h1>
      <p>Напишите фразу — модель покажет её жестами. Модель можно вращать мышью или пальцем.</p>
    </section>

    <section class="app">
      <div class="viewer" id="viewer" aria-label="3D модель руки"></div>
      <div class="panel">
        <label for="text">Ваш текст</label>
        <textarea id="text" maxlength="200" placeholder="Например: Привет, как дела?"></textarea>
        <div class="row">
          <button id="play" type="button">Показать</button>
          <button id="stop" type="button" class="ghost">Стоп</button>
        </div>
        <p class="now" id="now" aria-live="polite">&nbsp;</p>
      </div>
    </section>
  </main>

  <footer>© 2026 Qol AI</footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.152.2/three.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
