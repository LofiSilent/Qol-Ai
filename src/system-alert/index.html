<!doctype html>
<html lang="kk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Ctext y=%2750%27 font-size=%2750%27%3E⚠%3C/text%3E%3C/svg%3E"><meta name="theme-color" content="#090d14"><title>SYSTEM FAILURE · Қалпына келтіру миссиясы</title>
<style>
:root{color-scheme:dark;--red:#ff565e;--muted:#929caa;--green:#57e4a2}*{box-sizing:border-box}body{margin:0;background:#090d14;color:#e9edf3;font-family:Arial,Helvetica,sans-serif;min-height:100svh}body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 5%,#9b182726,transparent 65%);border:1px solid #ff565e40}main{min-height:100svh;max-width:1500px;margin:auto;padding:32px 6vw;display:flex;flex-direction:column;justify-content:center;gap:26px}.top,.status{display:flex;align-items:center;justify-content:space-between;gap:18px}.mono,.eyebrow,.brand{font-size:12px;letter-spacing:.16em;color:var(--muted)}.status{font-size:11px;letter-spacing:.12em;color:var(--red);justify-content:flex-start}.dot{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 15px currentColor;animation:breathe 2.8s infinite}.top{position:absolute;top:32px;left:6vw;right:6vw}.center{text-align:center;margin:auto 0;padding:64px 0}.actions[hidden]{display:none}.eyebrow{color:var(--red);font-size:12px;letter-spacing:.26em;display:flex;align-items:center;justify-content:center;gap:10px}.shield{width:28px;height:31px}h1{font-size:clamp(44px,8.5vw,128px);letter-spacing:-.055em;line-height:1;margin:22px 0;color:var(--red);text-shadow:0 0 65px #ff364a24}h2{font-size:clamp(17px,2vw,28px);font-weight:500;line-height:1.5;max-width:900px;margin:0 auto 10px}.sub{color:var(--muted);font-size:clamp(14px,1.4vw,18px);line-height:1.6}.mission{margin:36px 0;font-size:15px;color:#bdc6d2;line-height:1.5}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:24px 0 12px}button{font:inherit}button:focus-visible,input:focus-visible{outline:2px solid #f1bd60;outline-offset:4px}.action{padding:13px 21px;border:1px solid #ffffff2b;border-radius:5px;color:#d8dfeb;background:#ffffff05;cursor:pointer;font-size:13px}.primary{background:var(--red);border-color:var(--red);color:#170c10;font-weight:700}.action:hover{filter:brightness(1.17)}input{accent-color:var(--red);width:76px}@keyframes breathe{50%{opacity:.4}}@media(max-width:600px){main{padding:22px 20px;gap:20px}.top{align-items:flex-start}.brand{font-size:10px}.status{font-size:9px}.action{padding:13px 15px}.sub{max-width:310px;margin:0 auto}}@media(prefers-reduced-motion:reduce){*,*:before{animation:none!important;transition:none!important}}
</style></head><body><main><header class="top"><div class="brand">UNIVERSITY / VIRTUAL SERVER</div><div class="status"><span class="dot"></span><span id="status">SYSTEM OFFLINE</span></div></header><section class="center"><div class="eyebrow"><svg class="shield" viewBox="0 0 24 28" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 2 3 6v8c0 6 9 11 9 11s9-5 9-11V6Z"/><path d="M12 8v7m0 3v2"/></svg><span id="eyebrow">CRITICAL SYSTEM ALERT</span></div><h1 id="title">SYSTEM FAILURE</h1><h2 id="message">Назар аударыңыз! Университеттің виртуалды сервері уақытша тоқтады.</h2><p class="sub" id="sub">Жүйені қалпына келтіру үшін 5 цифрлық кілт қажет.</p><div class="mission" id="mission" aria-live="polite">Миссия: барлық жұмбақты шешіп, серверді іске қосыңыз.</div><div class="actions" id="launch"><button class="action primary" id="start">▶ Іске қосу</button></div></section></main>
<script>
const start=document.getElementById('start'),launch=document.getElementById('launch');
let audio,master,carrier,sweep,depth,starting=false,active=false;
function createSiren(){
 audio=new(window.AudioContext||window.webkitAudioContext)();
 master=audio.createGain();master.gain.value=0;master.connect(audio.destination);
 carrier=audio.createOscillator();carrier.type='sawtooth';carrier.frequency.value=740;
 const filter=audio.createBiquadFilter();filter.type='lowpass';filter.frequency.value=2400;filter.Q.value=.7;
 sweep=audio.createOscillator();sweep.type='sine';sweep.frequency.value=.55;
 depth=audio.createGain();depth.gain.value=420;sweep.connect(depth);depth.connect(carrier.frequency);
 carrier.connect(filter);filter.connect(master);carrier.start();sweep.start();
}
async function run(){
 if(starting||active)return;starting=true;
 // Both requests start inside the user gesture so fullscreen and sound can activate together.
 const fullscreen=!document.fullscreenElement&&document.documentElement.requestFullscreen?document.documentElement.requestFullscreen().catch(()=>{}):Promise.resolve();
 try{if(!audio)createSiren();await audio.resume();master.gain.cancelScheduledValues(audio.currentTime);master.gain.setValueAtTime(0,audio.currentTime);master.gain.linearRampToValueAtTime(.65,audio.currentTime+.8);active=true;launch.hidden=true;await fullscreen}
 catch{launch.hidden=false;start.textContent='▶ Қайта іске қосу'}finally{starting=false}
}
function stop(){if(!audio)return;active=false;master.gain.cancelScheduledValues(audio.currentTime);master.gain.setValueAtTime(0,audio.currentTime);audio.suspend().catch(()=>{});launch.hidden=false}
start.onclick=run;
document.addEventListener('keydown',event=>{if(event.key==='Escape')stop()});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&active)stop()});
window.addEventListener('pagehide',stop);
</script></body></html>
